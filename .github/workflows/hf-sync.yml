name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove reserved Hugging Face Space icon file
        run: |
          if [ -f public/icon.png ]; then
            rm -f public/icon.png
            git add -A
            git commit -m "Remove incompatible Hugging Face Space icon" || true
          fi

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://jordanca3011:$HF_TOKEN@huggingface.co/spaces/jordanca3011/NightKnight_Cinema HEAD:main
