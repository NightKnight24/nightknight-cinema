name: Sync to Hugging Face
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::warning ::HF_TOKEN is not configured in GitHub repository secrets. Add HF_TOKEN under Settings -> Secrets and variables -> Actions to enable Hugging Face sync."
            exit 0
          fi
          git push --force https://jordanca3011:$HF_TOKEN@huggingface.co/spaces/jordanca3011/NightKnight_Cinema HEAD:main
