[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["config.json", "public/**"]

[[redirects]]
  from = "/icon.png"
  to = "/icon.png"
  status = 200

[[redirects]]
  from = "/background.png"
  to = "/background.png"
  status = 200

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/addon?__vpath=:splat"
  status = 200
  force = true
